<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Đặt lại mật khẩu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 380px; }
        h2 { text-align: center; color: #0084ff; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; background: #0084ff; color: white; }
        .link { text-align: center; margin-top: 15px; font-size: 14px; color: #65676b; }
        .message { background: #ffe8e8; color: #a00000; border: 1px solid #f5c2c2; padding: 12px; border-radius: 10px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2><i class="fas fa-key"></i> Đặt lại mật khẩu</h2>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="message">
                    {% for message in messages %}
                        <div>{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        <form method="POST" action="">
            <input type="password" name="password" placeholder="Mật khẩu mới" required>
            <input type="password" name="confirm_password" placeholder="Xác nhận mật khẩu" required>
            <button type="submit">Cập nhật mật khẩu</button>
        </form>
        <div class="link"><a href="/login">Quay lại đăng nhập</a></div>
    </div>
</body>
</html>
